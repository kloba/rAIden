name: tests
on: [push, pull_request]

jobs:
  python:
    name: unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements/console.lock }
      - run: pip install --require-hashes -r requirements/console.lock && pip install -e ".[console,dev]"
      - name: host agent (guardrails, classifier, aggregator, agent loop with a scripted model, daemon) and console (API, policy, SQL guard, assessment, cron)
        run: python -m pytest

  lint:
    name: lint (console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.11.8 check raiden/console tests/test_console_*.py tests/live

  e2e:
    name: end-to-end incident on the demo fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements/console.lock }
      - run: pip install --require-hashes -r requirements/console.lock && pip install -e ".[console,dev]"
      - run: python -m pytest tests/test_console_e2e.py
        env: { RAIDEN_SLOW_TESTS: "1" }

  web:
    name: web UI (typecheck and build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  image:
    name: container image
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t raiden-console:ci .
      - name: smoke test the demo
        run: |
          docker run -d --name raiden -p 8080:8080 -e RAIDEN_DEMO=1 raiden-console:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/v1/auth/status | grep '"demo":true'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null -D - http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          docker logs raiden | tail -20
