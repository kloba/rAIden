[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raiden-dba"
version = "0.1.0"
description = "rAIden: an autonomous on-call DBA for PostgreSQL that watches the log, fixes incidents behind guardrails and evolves after every fight"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openai>=1.50", "azure-identity>=1.17", "PyYAML>=6", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
raiden = "raiden.cli:main"

[tool.setuptools.packages.find]
include = ["raiden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
