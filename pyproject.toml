[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raiden-dba"
version = "0.2.0"
description = "rAIden: AI on-call DBA for PostgreSQL fleets. A web console that monitors any PostgreSQL, runs incidents through stages that are on autopilot or wait for a person, schedules DBA routines and answers questions in chat; plus a host agent that handles what only the server can see."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openai>=1.50", "azure-identity>=1.17", "PyYAML>=6", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
# the web console (`raiden console`); the host agent (`raiden run`) needs only the base dependencies
console = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "cryptography>=42",
    "tzdata>=2024.1",
]
dev = ["pytest>=8", "raiden-dba[console]"]

[project.scripts]
raiden = "raiden.cli:main"

[tool.setuptools.packages.find]
include = ["raiden*"]

[tool.setuptools.package-data]
# the built web UI (web/dist) is copied here by the Dockerfile and by `make web`
"raiden.console" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
